name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java-core:
    name: Java Core API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

  go-realtime:
    name: Go Realtime Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/realtime-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: services/realtime-gateway/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify dependency checksums
        run: go mod verify
      - name: Ensure module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/server

  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build

  full-stack-smoke:
    name: Full stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [java-core, go-realtime, web]
    steps:
      - uses: actions/checkout@v7
      - name: Run smoke suite
        run: bash scripts/ci-smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans
