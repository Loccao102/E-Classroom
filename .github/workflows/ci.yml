name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java-core:
    name: Java Core API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  go-realtime:
    name: Go Realtime Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: services/realtime-gateway/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify dependency checksums
        run: go mod verify
      - name: Ensure module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/server
