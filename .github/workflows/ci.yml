name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java-core:
    name: Java Core API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  go-realtime:
    name: Go Realtime Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Resolve module graph
        run: |
          go mod tidy
          echo '--- GENERATED GO.MOD ---'
          cat go.mod
          echo '--- GENERATED GO.SUM ---'
          cat go.sum
          echo '--- END GENERATED MODULE FILES ---'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/server
